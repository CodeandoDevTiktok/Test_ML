# Un entorno por proyecto (guía S03). Crear:  conda env create -f environment.yml
name: p09-reingreso
channels: [conda-forge]
dependencies:
  - python=3.12
  - pandas>=2.2
  - pyarrow>=15
  - numpy
  - scikit-learn>=1.5
  - matplotlib
  - seaborn
  - pyyaml
  - optuna>=4.0
  - dvc>=3.50
  - dvc-s3            # conector S3/MinIO (el paquete base no trae ninguno)
  - jupyterlab
  - ipykernel
  - pytest
  - pip
  - pip:
      - "mlflow>=3.1"   # su canal conda va detrás (guía S04)
      - -e .            # instala el paquete p09 (src/) en modo editable
